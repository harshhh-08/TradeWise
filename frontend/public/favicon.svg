<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded App Icon Background -->
  <rect width="100" height="100" rx="22" fill="#151b28" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>

  <!-- Subtle Financial Grid -->
  <line x1="25" y1="18" x2="25" y2="82" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  <line x1="50" y1="18" x2="50" y2="82" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  <line x1="75" y1="18" x2="75" y2="82" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  <line x1="18" y1="35" x2="82" y2="35" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  <line x1="18" y1="65" x2="82" y2="65" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- Bar 1 (Left - Blue) -->
  <rect x="24" y="52" width="11" height="28" rx="5.5" fill="#2563eb"/>

  <!-- Bar 2 (Middle - Emerald Green) -->
  <rect x="42" y="38" width="11" height="42" rx="5.5" fill="#10b981"/>

  <!-- Bar 3 (Right - Emerald Green) -->
  <rect x="60" y="24" width="11" height="56" rx="5.5" fill="#10b981"/>

  <!-- Dynamic Trend Checkmark Line -->
  <path d="M26 49 L46 68 L73 34" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Uptrend Arrowhead / Beacon -->
  <polygon points="71,24 81,35 69,37" fill="#10b981"/>
  <circle cx="80" cy="25" r="4.5" fill="#ffffff"/>
</svg>
